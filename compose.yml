name: faucet

services:
  caddy:
    image: caddy@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f # :alpine
    depends_on:
      - php-fpm
    ports:
      - "127.0.0.1:8080:80"
    restart: on-failure
    volumes:
      - ./docs/caddy/Caddyfile-dev:/etc/caddy/Caddyfile
      - ./web:/var/www/signet-faucet/web
      - caddy_config:/config
      - caddy_data:/data

  php-fpm:
    image: 1maa/php:8.5
    restart: on-failure
    env_file:
      - .env.dist
    volumes:
      - .:/var/www/signet-faucet
    working_dir: /var/www/signet-faucet

  valkey:
    image: valkey/valkey@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b # :9-alpine
    restart: on-failure
    volumes:
      - valkey_data:/data

  node:
    image: 1maa/bitcoin:latest
    healthcheck:
      test: netstat -ltn | grep 18443 > /dev/null
      start_interval: 125ms
      start_period: 500ms
    restart: on-failure
    volumes:
      - ./docs/knots/bitcoin.conf:/home/bitcoin/.bitcoin/bitcoin.conf
      - node_data:/home/bitcoin/.bitcoin

volumes:
  caddy_config:
  caddy_data:
  node_data:
  valkey_data:
